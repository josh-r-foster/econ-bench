name: Offline quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install offline test dependencies
        run: python -m pip install pytest jsonschema numpy pandas matplotlib scipy tqdm python-dotenv

      - name: Run offline tests
        run: python -m pytest -q
