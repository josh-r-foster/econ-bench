name: Offline quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install offline test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run offline tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m pytest -q

      - name: Test browser model identifiers
        run: node tests/js/test_model_ids.js

      - name: Check published website catalog
        run: python scripts/build_web_catalog.py --check

      - name: Test website missing-data handling
        run: node tests/js/test_web_data.js

      - name: Validate canonical release structure
        run: python scripts/validate_results.py --allow-incomplete
